# Pretender quality-gate config (wired via lefthook.yml `ddl-pretender-gate`:
# `pretender check --diff-only --mode gate`).
#
# NOTE: pretender 0.7.0 walks paths with a "./" prefix, so exclude globs must
# carry it ("./tests/**" matches; "tests/**" silently does not). See the
# upstream pretender feedback filed for this (espectacular-dwc).
#
# History: tests/check_cli.rs was excluded as a PRE-EXISTING violation
# (~1631 lines, 4x the 400 app-role file_lines limit, plus parser false
# errors). The split into tests/check_cli/* landed (espectacular-m53) and
# the exclusion is gone — every test file is now under the limit and
# gate-checked like everything else.
[pretender]
mode = "gate"
languages = ["auto"]
exclude = [
  "./vendor/**",
  "./node_modules/**",
  "./**/*_generated.*",
  "./target/**",
  "./.venv/**",
]

[roles.test]
paths = ["tests/**", "**/*_test.*", "spec/**"]