# Pretender quality-gate config (wired via lefthook.yml `ddl-pretender-gate`:
# `pretender check --diff-only --mode gate`).
#
# NOTE: pretender 0.7.0 walks paths with a "./" prefix, so exclude globs must
# carry it ("./tests/check_cli.rs" matches; "tests/check_cli.rs" silently
# does not). See the upstream pretender feedback filed for this.
#
# tests/check_cli.rs is excluded from the gate as a PRE-EXISTING violation:
# the file was ~1631 lines (4x the 400 app-role file_lines limit that falls
# through to test files) before this config existed, and pretender 0.7.0's
# Rust parser reports "Parse errors detected" on it, falling back to raw line
# counts. Excluding it here cements a known blindness — see the split ticket
# that carves this file into focused test files; remove the exclusion once
# the split lands.
[pretender]
mode = "gate"
languages = ["auto"]
exclude = [
  "./vendor/**",
  "./node_modules/**",
  "./**/*_generated.*",
  "./target/**",
  "./.venv/**",
  "./tests/check_cli.rs",
]

[roles.test]
paths = ["tests/**", "**/*_test.*", "spec/**"]