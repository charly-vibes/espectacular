# CI workflow - runs the same commands as local development
#
# Uses `just ci` to ensure parity between local and CI environments.
# If CI fails, run `just ci` locally to reproduce the issue.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      # Run the exact same command as local development
      - name: Install specodelic (corpus gate in `just ci`)
        run: cargo install --git https://github.com/charly-vibes/specodelic.git --locked

      - name: Install ecosystem tools (§4 dogfood matrix, pinned)
        run: |
          cargo install --locked pretender@0.7.0 wai-cli@2026.9.28 dulce-de-leche@0.7.0
          npm install -g @fission-ai/openspec@0.19.0
      - name: Install bd (beads, pinned §4)
        run: |
          tmp=$(mktemp -d)
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz -o "$tmp/bd.tgz"
          # extract only the binary — the tarball also ships README/LICENSE/CHANGELOG
          # which must not clobber the repo checkout
          tar -xzf "$tmp/bd.tgz" -C "$tmp" bd
          sudo mv "$tmp/bd" /usr/local/bin/bd
      # §4 dogfood: installed tools must run, not just install
      - name: Smoke dogfooded tools
        env:
          DO_NOT_TRACK: "1"
        run: |
          bd --version >/dev/null
          ddl status >/dev/null
          wai status >/dev/null
          openspec validate --all >/dev/null
          pretender check >/dev/null
      - name: Run CI pipeline
        run: just ci

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: espectacular-linux-amd64
          path: target/release/espectacular

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run coverage
        run: cargo tarpaulin

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/cobertura.xml
          fail_ci_if_error: false
  spec-gate:
    name: Specodelic dual-format gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install specodelic (pinned crates.io release — 0.4.0: Rev 7 kinds + tiered single_root_reachable + graph dangling msgs)
        run: cargo install specodelic --locked --version 0.4.0

      - name: Spec corpus mandate (spk lint + frontmatter over all non-archived spec.md)
        run: just spec-lint

      - name: spk graph (typing violations + dangling refs over the corpus)
        run: spk graph openspec --json > /dev/null

      - name: ah sync --check (derived contracts fresh, zero writes)
        run: cargo build --locked && target/debug/ah sync --check
