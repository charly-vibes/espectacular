name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'theme/**'
      - 'Cargo.toml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Copy specs into docs source
        run: cp -r openspec/specs docs/src/specs

      - name: Generate release-status page from Cargo.toml
        # §6 (DDL-j0u): the book's version claims must come from Cargo.toml,
        # never from hand-typed text — hand-typed versions drift (ddl's
        # deployed book said v0.5.0 while the repo was v0.7.0).
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          TAG="${GITHUB_REF_NAME:-main}"
          mkdir -p docs/src
          cat > docs/src/release.md <<EOF
          # Release Status

          > **Generated artifact** (docs.yml, from Cargo.toml + git ref).
          > Do not hand-edit — the repo source files remain authoritative.

          - **Version:** v${VERSION}
          - **Built from:** ${TAG} @ ${GITHUB_SHA::7}
          EOF

      - name: Build docs
        run: mdbook build

      - name: Copy llm.txt to site root
        # book.toml build-dir is docs/_book (DDL-jnt root-book standardization)
        # Deploy the LLM-oriented summaries to the Pages site root
        run: cp llms.txt llm.txt docs/_book/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
