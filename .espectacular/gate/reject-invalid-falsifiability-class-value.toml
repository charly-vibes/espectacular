id = "reject-invalid-falsifiability-class-value"
description = "An invalid falsifiability_class value (e.g. \"eventual\") emits an invalid-falsifiability-class structural finding and blocks scenario test execution."
archetype = "PF"
status = "active"
superseded_by = ""
authored_with = "0.7.0"
falsifiability_class = "safety"

[[tests.shell]]
command = "cargo test -q check::tests::invalid_falsifiability_class_emits_structural_finding -- --exact && cargo test -q check::tests::invalid_falsifiability_class_blocks_scenario_execution -- --exact"
timeout_seconds = 60
