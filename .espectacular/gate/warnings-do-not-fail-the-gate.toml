id = "warnings-do-not-fail-the-gate"
description = "A run whose only finding is a warning (category warning, severity warning) exits zero: ah check --run-tests --json succeeds and tests still run and pass."
archetype = "PF"
status = "active"
superseded_by = ""
authored_with = "0.7.0"
