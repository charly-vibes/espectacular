id = "accept-valid-falsifiability-class-values"
description = "A contract with falsifiability_class = \"safety\" (or \"liveness\") validates and runs its declared tests normally; safety produces no findings, liveness only the bounded-timeout warning."
archetype = "PF"
status = "active"
superseded_by = ""
authored_with = "0.7.0"
falsifiability_class = "safety"

[[tests.shell]]
command = "cargo test -q check::tests::valid_falsifiability_class_values_pass_and_run_tests -- --exact"
timeout_seconds = 60
