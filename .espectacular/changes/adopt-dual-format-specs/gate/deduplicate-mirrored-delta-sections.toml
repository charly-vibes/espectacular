id = "deduplicate-mirrored-delta-sections"
description = "Identical (id, body) scenario headings in mirrored delta sections (## ADDED Requirements / ## Requirements) discover exactly once; no slug-collision finding for the mirror."
archetype = "PF"
status = "active"
superseded_by = ""
authored_with = "0.6.0"

[[tests.shell]]
command = "cargo test -q openspec::tests::mirror_identical_id_and_body_yields_one_scenario -- --exact && cargo test -q openspec::tests::mirror_dedupe_keeps_first_occurrence_source_line -- --exact"
timeout_seconds = 60
